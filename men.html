<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Techvolt Software | PHP Development | Coimbatore</title>
    <meta name="description" content="Explore the men's collection with a range of casual shirts, cotton t-shirts, pants, and fashion products on our ecommerce website.">
    <meta name="keywords" content="Techvolt Software, PHP Development, men clothing, casual shirts, t-shirts, trousers, men fashion">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.techvoltcoimbatore.com/men.html">
    <link rel="icon" type="image/png" href="assets/images/techvolt-software-development-brand-favicon.png">
    <link rel="apple-touch-icon" href="assets/images/techvolt-software-development-brand-favicon.png">
    <meta property="og:site_name" content="TechVoltMart">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.techvoltcoimbatore.com/men.html">
    <meta property="og:title" content="Techvolt Software | Web Development | Men's Collection">
    <meta property="og:description" content="Explore the men's collection with a range of casual shirts, cotton t-shirts, pants, and fashion products on our ecommerce website.">
    <meta property="og:image" content="https://www.techvoltcoimbatore.com/assets/images/techvolt-software-development-brand-logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Techvolt Software |  Digital Marketing | Men's Collection">
    <meta name="twitter:description" content="Explore the men's collection with a range of casual shirts, cotton t-shirts, pants, and fashion products on our ecommerce website.">
    <meta name="twitter:image" content="https://www.techvoltcoimbatore.com/assets/images/techvolt-software-development-brand-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/men.css" />
    <link rel="stylesheet" href="css/cart-fly-animation.css" />
  </head>
  <body>
    <!-- Header -->
    <!-- Reusable Navbar Component -->
    <div id="navbar-placeholder"></div>

    <section class="category-banner-section">
      <div class="category-breadcrumb">
        <a href="index.html">Home</a>
        <span class="sep">/</span>
        <a href="men.html">Men</a>
        <span class="sep">/</span>
        <span class="active-crumb">Shirts & T-Shirts</span>
      </div>
      <div class="category-header-title-row">
        <h1 class="category-page-title">
          Men's Topwear — Shirts & T-Shirts Store
        </h1>
        <span class="category-showing-count">- 8 items</span>
      </div>
    </section>

    <!-- Backdrop Overlay for Filter Panel -->
    <div class="filter-backdrop" id="filterBackdrop"></div>

    <!-- Main Layout -->
    <section class="category-page-layout">
      <aside class="category-sidebar" id="categorySidebar">
        <div
          class="filter-header d-flex justify-content-between align-items-center mb-3"
        >
          <h4
            style="
              font-size: 15px;
              font-weight: 800;
              color: #282c3f;
              margin: 0;
              text-transform: uppercase;
            "
          >
            FILTERS
          </h4>
          <button
            type="button"
            id="btnCloseSidebar"
            class="d-lg-none"
            style="
              background: none;
              border: none;
              font-size: 22px;
              color: #282c3f;
              cursor: pointer;
              padding: 0;
              line-height: 1;
            "
          >
            &times;
          </button>
        </div>

        <div class="filter-group">
          <h4 class="sidebar-section-title">CATEGORIES</h4>
          <ul class="filter-options-list">
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_cat_all"
                    data-group="category"
                    value="all"
                    checked
                  />
                  All Men</span
                ><span class="filter-count-myntra">(8)</span></label
              >
            </li>
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_cat_shirt"
                    data-group="category"
                    value="shirts"
                  />
                  Shirts</span
                ><span class="filter-count-myntra">(3)</span></label
              >
            </li>
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_cat_tshirt"
                    data-group="category"
                    value="tshirts"
                  />
                  T-Shirts</span
                ><span class="filter-count-myntra">(5)</span></label
              >
            </li>
          </ul>
        </div>

        <div class="filter-group">
          <h4 class="sidebar-section-title">BRAND</h4>
          <ul class="filter-options-list">
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_brand_roadster"
                    data-group="brand"
                    value="roadster"
                  />
                  ROADSTER</span
                ><span class="filter-count-myntra">(1)</span></label
              >
            </li>
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_brand_highlander"
                    data-group="brand"
                    value="highlander"
                  />
                  HIGHLANDER</span
                ><span class="filter-count-myntra">(1)</span></label
              >
            </li>
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_brand_uspa"
                    data-group="brand"
                    value="u.s. polo assn."
                  />
                  U.S. POLO ASSN.</span
                ><span class="filter-count-myntra">(1)</span></label
              >
            </li>
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_brand_puma"
                    data-group="brand"
                    value="puma"
                  />
                  PUMA</span
                ><span class="filter-count-myntra">(1)</span></label
              >
            </li>
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_brand_adidas"
                    data-group="brand"
                    value="adidas"
                  />
                  ADIDAS</span
                ><span class="filter-count-myntra">(1)</span></label
              >
            </li>
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_brand_nike"
                    data-group="brand"
                    value="nike"
                  />
                  NIKE</span
                ><span class="filter-count-myntra">(1)</span></label
              >
            </li>
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_brand_ua"
                    data-group="brand"
                    value="under armour"
                  />
                  UNDER ARMOUR</span
                ><span class="filter-count-myntra">(1)</span></label
              >
            </li>
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_brand_reebok"
                    data-group="brand"
                    value="reebok"
                  />
                  REEBOK</span
                ><span class="filter-count-myntra">(1)</span></label
              >
            </li>
          </ul>
        </div>

        <div class="filter-group">
          <h4 class="sidebar-section-title">PRICE</h4>
          <ul class="filter-options-list">
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_price_under1k"
                    data-group="price"
                    value="under-1000"
                  />
                  Under ₹1,000</span
                ><span class="filter-count-myntra">(4)</span></label
              >
            </li>
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_price_1k2k"
                    data-group="price"
                    value="1000-2000"
                  />
                  ₹1,000 – ₹2,000</span
                ><span class="filter-count-myntra">(4)</span></label
              >
            </li>
            <li>
              <label class="filter-checkbox-label"
                ><span
                  ><input
                    type="checkbox"
                    id="side_price_2k"
                    data-group="price"
                    value="2000-plus"
                  />
                  ₹2,000+</span
                ><span class="filter-count-myntra">(0)</span></label
              >
            </li>
          </ul>
        </div>
      </aside>

      <main class="category-main-content">
        <!-- Dynamic Single Source of Truth Product Grid -->
        <div class="products-grid"></div>
      </main>
    </section>

    <!-- Floating Sticky Elements -->

    <button class="myntra-floating-bell-btn" title="Notifications">
      <i class="bi bi-bell-fill"></i>
    </button>
    <!-- Footer -->
    <!-- Reusable Footer Component -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart-fly-animation.js"></script>
    <script src="js/men.js"></script>
  </body>
</html>

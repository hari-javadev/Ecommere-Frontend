<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Techvolt Software | CRM Development | Customer Management & Account</title>
    <meta name="description" content="Manage your customer profile, saved addresses, active orders, and account preferences with Techvolt Software.">
    <meta name="keywords" content="Techvolt Software, CRM Development, customer account, user profile, order management">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.techvoltcoimbatore.com/account.html">
    <link rel="icon" type="image/png" href="assets/images/techvolt-software-development-brand-favicon.png">
    <link rel="apple-touch-icon" href="assets/images/techvolt-software-development-brand-favicon.png">
    <meta property="og:site_name" content="TechVoltMart">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.techvoltcoimbatore.com/account.html">
    <meta property="og:title" content="Techvolt Software | CRM Development | Customer Management & Account">
    <meta property="og:description" content="Manage your customer profile, saved addresses, active orders, and account preferences with Techvolt Software.">
    <meta property="og:image" content="https://www.techvoltcoimbatore.com/assets/images/techvolt-software-development-brand-logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Techvolt Software | CRM Development | Customer Management & Account">
    <meta name="twitter:description" content="Manage your customer profile, saved addresses, active orders, and account preferences with Techvolt Software.">
    <meta name="twitter:image" content="https://www.techvoltcoimbatore.com/assets/images/techvolt-software-development-brand-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .account-page-container {
            max-width: 900px;
            margin: 40px auto 70px auto;
            padding: 0 4%;
        }

        .account-header-banner {
            background: linear-gradient(135deg, #1f1b18 0%, #3a322c 100%);
            border-radius: 16px;
            padding: 32px 40px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        .user-welcome-info h2 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 4px 0;
            font-family: 'DM Sans', sans-serif;
        }

        .user-welcome-info p {
            font-size: 13.5px;
            color: #d4c5b9;
            margin: 0;
        }

        .account-content-card {
            background: #ffffff;
            border: 1px solid #eaeaec;
            border-radius: 16px;
            padding: 36px 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }

        .card-heading-title {
            font-size: 20px;
            font-weight: 800;
            color: #171717;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .form-label-account {
            font-size: 12px;
            font-weight: 700;
            color: #333333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: block;
        }

        .form-control-account {
            width: 100%;
            height: 46px;
            padding: 0 16px;
            border: 1px solid #dcd3ca;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fafafa;
            color: #171717;
            transition: all 0.25s ease;
        }

        .form-control-account:focus {
            border-color: #ff3f6c;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 63, 108, 0.12);
        }

        .btn-save-account {
            width: 100%;
            height: 48px;
            background: #ff3f6c;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(255, 63, 108, 0.3);
            margin-top: 10px;
        }

        .btn-save-account:hover {
            background: #e0355c;
            box-shadow: 0 6px 20px rgba(255, 63, 108, 0.45);
        }

        .auth-footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
            color: #666666;
        }

        .auth-footer-text a {
            color: #ff3f6c;
            font-weight: 700;
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .account-content-card {
                padding: 24px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Site Header -->
    <!-- Reusable Navbar Component -->
    <div id="navbar-placeholder"></div>

    <!-- Main Account Page Body -->
    <main class="account-page-container">
        
        <!-- Welcome Banner -->
        <div class="account-header-banner">
            <div class="user-welcome-info">
                <h2>Create Your TechVoltMart Account</h2>
                <p>Register now to manage your orders, wishlist, and enjoy exclusive member offers.</p>
            </div>
        </div>

        <!-- Account Form Card -->
        <div class="account-content-card">
            <div class="card-heading-title">
                <i class="bi bi-person-plus text-danger me-2"></i> Necessary Details Only
            </div>

            <form onsubmit="event.preventDefault(); alert('Account Created Successfully!'); window.location.href='login.html';">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label-account">Full Name</label>
                        <input type="text" class="form-control-account" placeholder="Enter your full name">
                    </div>

                    <div class="col-12">
                        <label class="form-label-account">Email Address</label>
                        <input type="email" class="form-control-account" placeholder="Enter your email address">
                    </div>

                    <div class="col-12">
                        <label class="form-label-account">Mobile Number</label>
                        <input type="tel" class="form-control-account" placeholder="Enter 10-digit mobile number">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label-account">Password</label>
                        <input type="password" class="form-control-account" placeholder="Create password">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label-account">Confirm Password</label>
                        <input type="password" class="form-control-account" placeholder="Confirm password">
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn-save-account">Create Account</button>
                </div>
            </form>

            <div class="auth-footer-text">
                Already have an account? <a href="login.html">Log In</a>
            </div>
        </div>
    </main>

    <!-- Reusable Footer Component -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

<body>
    <!-- Header -->
    <!-- Reusable Navbar Component -->
    <div id="navbar-placeholder"></div>

    <section class="category-banner-section">
        <div class="category-breadcrumb">
            <a href="index.html">Home</a>
            <span class="sep">/</span>
            <a href="ethnic.html">Women</a>
            <span class="sep">/</span>
            <span class="active-crumb">Sarees</span>
        </div>
        <div class="category-header-title-row">
            <h1 class="category-page-title">Women Ethnic Wear — Sarees & Kurtis Store</h1>
            <span class="category-showing-count">- 3 items</span>
        </div>
    </section>

    <!-- Backdrop Overlay for Filter Panel -->
    <div class="filter-backdrop" id="filterBackdrop"></div>

    <!-- Main Layout -->
    <section class="category-page-layout">
        <aside class="category-sidebar" id="categorySidebar">
            <div class="filter-header d-flex justify-content-between align-items-center mb-3">
                <h4 style="font-size: 15px; font-weight: 800; color: #282c3f; margin: 0; text-transform: uppercase;">FILTERS</h4>
                <button type="button" id="btnCloseSidebar" class="d-lg-none" style="background: none; border: none; font-size: 22px; color: #282c3f; cursor: pointer; padding: 0; line-height: 1;">&times;</button>
            </div>

            <div class="filter-group">
                <h4 class="sidebar-section-title">CATEGORIES</h4>
                <ul class="filter-options-list">
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_cat_all" data-group="category" value="all" checked> Women Ethnic</span><span class="filter-count-myntra">(8)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_cat_kurti" data-group="category" value="kurtis"> Kurti</span><span class="filter-count-myntra">(6)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_cat_saree" data-group="category" value="sarees"> Saree</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_cat_lehenga" data-group="category" value="lehengas"> Lehenga</span><span class="filter-count-myntra">(1)</span></label></li>

            </div>

                <h4 class="sidebar-section-title">BRAND</h4>
                <ul class="filter-options-list">
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_royal" data-group="brand" value="royal silks"> ROYAL SILKS</span><span class="filter-count-myntra">(2)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_sangria" data-group="brand" value="sangria"> SANGRIA</span><span class="filter-count-myntra">(4)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_vanya" data-group="brand" value="vanya"> Vanya</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_zivara" data-group="brand" value="zivara"> Zivara</span><span class="filter-count-myntra">(1)</span></label></li>
                </ul>
            </div>

            <div class="filter-group">
                <h4 class="sidebar-section-title">PRICE</h4>
                <ul class="filter-options-list">
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_price_under2k" data-group="price" value="under-2000"> Under ₹2,000</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_price_2k4k" data-group="price" value="2000-4000"> ₹2,000 – ₹4,000</span><span class="filter-count-myntra">(0)</span></label></li>

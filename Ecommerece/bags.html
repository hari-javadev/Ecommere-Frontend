<body>
    <!-- Header -->
    <!-- Reusable Navbar Component -->
    <div id="navbar-placeholder"></div>

    <section class="category-banner-section">
        <div class="category-breadcrumb">
            <a href="index.html">Home</a>
            <span class="sep">/</span>
            <a href="bags.html">Clothing</a>
            <span class="sep">/</span>
            <span class="active-crumb">Bags & Footwear</span>
        </div>
        <div class="category-header-title-row">
            <h1 class="category-page-title">Bags & Footwear Collection</h1>
            <span class="category-showing-count">- 7 items</span>
        </div>
    </section>

    <!-- Backdrop Overlay for Filter Panel -->
    <div class="filter-backdrop" id="filterBackdrop"></div>

    <!-- Main Layout -->
    <section class="category-page-layout">
        <aside class="category-sidebar" id="categorySidebar">
            <div class="filter-header d-flex justify-content-between align-items-center mb-3">
                <h4 style="font-size: 15px; font-weight: 800; color: #282c3f; margin: 0; text-transform: uppercase;">FILTERS</h4>
                <button type="button" id="btnCloseSidebar" class="d-lg-none" style="background: none; border: none; font-size: 22px; color: #282c3f; cursor: pointer; padding: 0; line-height: 1;">&times;</button>
            </div>

            <div class="filter-group">
                <h4 class="sidebar-section-title">CATEGORIES</h4>
                <ul class="filter-options-list">
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_cat_all" data-group="category" value="all" checked> Bags & Footwear</span><span class="filter-count-myntra">(7)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_cat_bags" data-group="category" value="bags"> Bags</span><span class="filter-count-myntra">(5)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_cat_footwear" data-group="category" value="footwear"> Footwear</span><span class="filter-count-myntra">(2)</span></label></li>
                </ul>
            </div>

            <div class="filter-group">
                <h4 class="sidebar-section-title">BRAND</h4>
                <ul class="filter-options-list">
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_maison" data-group="brand" value="maison sable"> MAISON SABLE</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_aldo" data-group="brand" value="aldo"> ALDO</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_steve" data-group="brand" value="steve madden"> STEVE MADDEN</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_mk" data-group="brand" value="michael kors"> MICHAEL KORS</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_coach" data-group="brand" value="coach"> COACH</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_puma" data-group="brand" value="puma"> PUMA</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_nike" data-group="brand" value="nike"> NIKE</span><span class="filter-count-myntra">(1)</span></label></li>
                </ul>
            </div>

            <div class="filter-group">
                <h4 class="sidebar-section-title">PRICE</h4>
                <ul class="filter-options-list">
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_price_under2k" data-group="price" value="under-2000"> Under ₹2,000</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_price_2k3k" data-group="price" value="2000-3000"> ₹2,000 – ₹3,000</span><span class="filter-count-myntra">(3)</span></label></li>
                    <li><label class="filter-checkbox-label" ><span><input type="checkbox" id="side_price_3k4k" data-group="price" value="3000-4000"> ₹3,000 – ₹4,000</span><span class="filter-count-myntra">(2)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_price_4k" data-group="price" value="4000-plus"> ₹4,000+</span><span class="filter-count-myntra">(1)</span></label></li>
                </ul>
            </div>
        </aside>

        <main class="category-main-content">
            <!-- 5 Columns Product Grid matching exact screenshot -->
            <!-- Dynamic Single Source of Truth Product Grid -->
            <div class="products-grid"></div>

            
        </main>

    <!-- Floating Sticky Elements -->

    <button class="myntra-floating-bell-btn" title="Notifications">
        <i class="bi bi-bell-fill"></i>
    </button>

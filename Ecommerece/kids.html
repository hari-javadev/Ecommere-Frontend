</head>
<body>
    <!-- Header -->
    <!-- Reusable Navbar Component -->
    <div id="navbar-placeholder"></div>

    <section class="category-banner-section">
        <div class="category-breadcrumb">
            <a href="index.html">Home</a>
            <span class="sep">/</span>
            <a href="kids.html">Clothing</a>
            <span class="sep">/</span>
            <span class="active-crumb">Kids & Toys</span>
        </div>
        <div class="category-header-title-row">
            <h1 class="category-page-title">Kids Fashion & Educational Toys Store</h1>
            <span class="category-showing-count">- 8 items</span>
        </div>
    </section>

    <!-- Backdrop Overlay for Filter Panel -->
    <div class="filter-backdrop" id="filterBackdrop"></div>

    <!-- Main Layout -->
    <section class="category-page-layout">
        <aside class="category-sidebar" id="categorySidebar">
            <div class="filter-header d-flex justify-content-between align-items-center mb-3">
                <h4 style="font-size: 15px; font-weight: 800; color: #282c3f; margin: 0; text-transform: uppercase;">FILTERS</h4>
                <button type="button" id="btnCloseSidebar" class="d-lg-none" style="background: none; border: none; font-size: 22px; color: #282c3f; cursor: pointer; padding: 0; line-height: 1;">&times;</button>
            </div>

            <div class="filter-group">
                <h4 class="sidebar-section-title">CATEGORIES</h4>
                <ul class="filter-options-list">
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_cat_all" data-group="category" value="all" checked> All Kids & Toys</span><span class="filter-count-myntra">(8)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_cat_kids" data-group="category" value="kids"> Kids Apparel</span><span class="filter-count-myntra">(3)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_cat_toys" data-group="category" value="toys"> Toys</span><span class="filter-count-myntra">(5)</span></label></li>
                </ul>
            </div>

            <div class="filter-group">
                <h4 class="sidebar-section-title">BRAND</h4>
                <ul class="filter-options-list">
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_roboticskids" data-group="brand" value="robotics kids"> ROBOTICS KIDS</span><span class="filter-count-myntra">(3)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_hotwheels" data-group="brand" value="hot wheels"> HOT WHEELS</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_nerf" data-group="brand" value="nerf"> NERF</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_fisherprice" data-group="brand" value="fisher-price"> FISHER-PRICE</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_brand_funskool" data-group="brand" value="funskool"> FUNSKOOL</span><span class="filter-count-myntra">(1)</span></label></li>
                </ul>
            </div>

            <div class="filter-group">
                <h4 class="sidebar-section-title">PRICE</h4>
                <ul class="filter-options-list">
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_price_under500" data-group="price" value="under-500"> Under ₹500</span><span class="filter-count-myntra">(1)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_price_500_1000" data-group="price" value="500-1000"> ₹500 – ₹1,000</span><span class="filter-count-myntra">(3)</span></label></li>
                    <li><label class="filter-checkbox-label"><span><input type="checkbox" id="side_price_1000_2000" data-group="price" value="1000-2000"> ₹1,000 – ₹2,000</span><span class="filter-count-myntra">(4)</span></label></li>
                </ul>
            </div>
        </aside>

        <main class="category-main-content">
            <!-- Dynamic Single Source of Truth Product Grid -->
            <div class="products-grid"></div>

           
        </main>
    </section>

    <!-- Floating Sticky Elements -->

    <button class="myntra-floating-bell-btn" title="Notifications">
        <i class="bi bi-bell-fill"></i>
    </button>
    <!-- Footer -->
    <!-- Reusable Footer Component -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart-fly-animation.js"></script>
    <script src="js/kids.js"></script>

</html>

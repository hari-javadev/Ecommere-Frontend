<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Techvolt Software | Frontend Development | Saibaba Colony</title>
    <meta name="description" content="View and manage your saved favorite products, track price drops, and move items to your shopping cart.">
    <meta name="keywords" content="Techvolt Software, Frontend Development, wishlist, saved products, favorites">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.techvoltcoimbatore.com/wishlist.html">
    <link rel="icon" type="image/png" href="assets/images/techvolt-software-development-brand-favicon.png">
    <link rel="apple-touch-icon" href="assets/images/techvolt-software-development-brand-favicon.png">
    <meta property="og:site_name" content="TechVoltMart">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.techvoltcoimbatore.com/wishlist.html">
    <meta property="og:title" content="Techvolt Software | Python Development | Customer Wishlist">
    <meta property="og:description" content="View and manage your saved favorite products, track price drops, and move items to your shopping cart.">
    <meta property="og:image" content="https://www.techvoltcoimbatore.com/assets/images/techvolt-software-development-brand-logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Techvolt Software | Web Development | Customer Wishlist">
    <meta name="twitter:description" content="View and manage your saved favorite products, track price drops, and move items to your shopping cart.">
    <meta name="twitter:image" content="https://www.techvoltcoimbatore.com/assets/images/techvolt-software-development-brand-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart-fly-animation.css">
    <style>
        .wishlist-page-container {
            max-width: 1250px;
            margin: 30px auto 60px auto;
            padding: 0 4%;
        }

        .wishlist-header-bar {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eaeaec;
        }

        .wishlist-title {
            font-size: 22px;
            font-weight: 700;
            color: #282c3f;
            margin: 0;
        }

        .wishlist-count-badge {
            font-size: 15px;
            color: #7e818c;
            font-weight: 400;
        }

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        @media (max-width: 1100px) {
            .wishlist-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        @media (max-width: 768px) {
            .wishlist-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .wishlist-page-container {
                padding: 0 12px;
                margin: 20px auto 40px auto;
            }
        }

        @media (max-width: 480px) {
            .wishlist-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .wishlist-info {
                padding: 10px 8px;
            }
            .wishlist-item-brand {
                font-size: 11px;
            }
            .wishlist-item-title {
                font-size: 12px;
            }
            .wishlist-price-current {
                font-size: 13px;
            }
            .btn-move-to-bag {
                padding: 10px 0;
                font-size: 11.5px;
            }
        }

        .wishlist-card {
            background: #ffffff;
            border: 1px solid #eaeaec;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .wishlist-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .wishlist-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            background: #f5f5f6;
        }

        .wishlist-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .wishlist-card:hover .wishlist-img {
            transform: scale(1.04);
        }

        .btn-remove-wishlist {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #535766;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }

        .btn-remove-wishlist:hover {
            background: #ff3f6c;
            color: #ffffff;
            transform: scale(1.1);
        }

        .wishlist-info {
            padding: 14px 14px 10px 14px;
        }

        .wishlist-item-brand {
            font-size: 12px;
            font-weight: 700;
            color: #282c3f;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 3px;
        }

        .wishlist-item-title {
            font-size: 13.5px;
            color: #535766;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }

        .wishlist-item-price {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .wishlist-price-current {
            font-size: 14px;
            font-weight: 700;
            color: #282c3f;
        }

        .wishlist-price-original {
            font-size: 12px;
            color: #7e818c;
            text-decoration: line-through;
        }

        .wishlist-discount-badge {
            font-size: 12px;
            font-weight: 700;
            color: #ff905a;
        }

        .btn-move-to-bag {
            width: 100%;
            background: #ffffff;
            border: 1px solid #d4d5d9;
            border-radius: 0 0 8px 8px;
            color: #ff3f6c;
            font-size: 13px;
            font-weight: 700;
            padding: 12px 0;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-top: 1px solid #eaeaec;
        }

        .btn-move-to-bag:hover {
            background: #ff3f6c;
            color: #ffffff;
            border-color: #ff3f6c;
        }

        /* Empty State */
        .empty-wishlist-view {
            display: none;
            text-align: center;
            padding: 60px 20px;
        }

        .empty-wishlist-view i {
            font-size: 64px;
            color: #d4d5d9;
            margin-bottom: 20px;
        }

        .empty-wishlist-title {
            font-size: 20px;
            font-weight: 700;
            color: #282c3f;
            margin-bottom: 8px;
        }

        .empty-wishlist-sub {
            font-size: 14px;
            color: #7e818c;
            margin-bottom: 25px;
        }

        .btn-continue-shopping {
            display: inline-block;
            background: #ff3f6c;
            color: #ffffff;
            padding: 12px 36px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none !important;
            transition: background-color 0.2s ease;
        }

        .btn-continue-shopping:hover {
            background: #e6355d;
        }

        @media (max-width: 992px) {
            .wishlist-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .wishlist-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <!-- Reusable Navbar Component -->
    <div id="navbar-placeholder"></div>

    <main class="wishlist-page-container">
        <div class="wishlist-header-bar">
            <h1 class="wishlist-title">My Wishlist</h1>
            <span class="wishlist-count-badge" id="wishlistCountText">4 Items</span>
        </div>

        <!-- Wishlist Cards Grid -->
        <div class="wishlist-grid" id="wishlistGrid">
            <!-- Dynamically populated from SableWishlist -->
        </div>

        <!-- Empty Wishlist State -->
        <div class="empty-wishlist-view" id="emptyWishlistView">
            <i class="bi bi-heartbreak"></i>
            <h2 class="empty-wishlist-title">Your Wishlist is Empty</h2>
            <p class="empty-wishlist-sub">Explore our luxury collections and add your favourite styles to your wishlist.</p>
            <a href="index.html" class="btn-continue-shopping">CONTINUE SHOPPING</a>
        </div>
    </main>
    <!-- Footer -->
    <!-- Reusable Footer Component -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/components.js"></script>
    <script src="js/main.js"></script>
    <script src="js/cart-fly-animation.js"></script>
    <script>
        function renderWishlistPage() {
            const grid = document.getElementById('wishlistGrid');
            const countText = document.getElementById('wishlistCountText');
            const emptyView = document.getElementById('emptyWishlistView');
            if (!grid) return;

            const list = typeof SableWishlist !== 'undefined' ? SableWishlist.getWishlist() : [];
            const count = list.length;

            if (countText) {
                countText.textContent = `${count} ${count === 1 ? 'Item' : 'Items'}`;
            }

            if (count === 0) {
                grid.style.display = 'none';
                if (emptyView) emptyView.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            if (emptyView) emptyView.style.display = 'none';

            grid.innerHTML = list.map((item) => {
                const itemKey = SableWishlist.getItemKey(item);
                const link = item.link || 'index.html';
                const image = item.image || 'assets/images/techvolt-web-host-mobile-1.png';
                const brand = item.brand || 'SABLE';
                const title = item.title || item.name || 'SABLE Product';
                const price = item.price || '';
                const origPrice = item.originalPrice ? `<span class="wishlist-price-original">${item.originalPrice}</span>` : '';
                const discount = item.discount ? `<span class="wishlist-discount-badge">${item.discount}</span>` : '';

                return `
                    <div class="wishlist-card" data-key="${itemKey}">
                        <div class="wishlist-img-wrap">
                            <button class="btn-remove-wishlist" onclick="removeWishlistItem(this, '${encodeURIComponent(itemKey)}')" title="Remove item"><i class="bi bi-x-lg"></i></button>
                            <a href="${link}"><img src="${image}" class="wishlist-img" alt="${title}" onerror="this.onerror=null; this.src='assets/images/techvolt-web-host-mobile-1.png';"></a>
                        </div>
                        <div class="wishlist-info">
                            <span class="wishlist-item-brand">${brand}</span>
                            <div class="wishlist-item-title"><a href="${link}" style="text-decoration: none; color: inherit;">${title}</a></div>
                            <div class="wishlist-item-price">
                                <span class="wishlist-price-current">${price}</span>
                                ${origPrice}
                                ${discount}
                            </div>
                        </div>
                        <button class="btn-move-to-bag" onclick="moveToBag(this, '${encodeURIComponent(itemKey)}')">MOVE TO BAG</button>
                    </div>
                `;
            }).join('');
        }

        function removeWishlistItem(btn, encodedKey) {
            const card = btn ? btn.closest('.wishlist-card') : null;
            const key = encodedKey ? decodeURIComponent(encodedKey) : (card ? card.getAttribute('data-key') : '');
            
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                card.style.transition = 'all 0.3s ease';
            }

            setTimeout(() => {
                if (key && typeof SableWishlist !== 'undefined') {
                    SableWishlist.removeFromWishlist(key);
                }
                renderWishlistPage();
            }, card ? 300 : 0);
        }

        function moveToBag(btn, encodedKey) {
            const card = btn ? btn.closest('.wishlist-card') : null;
            const key = encodedKey ? decodeURIComponent(encodedKey) : (card ? card.getAttribute('data-key') : '');

            let wishItem = null;
            if (typeof SableWishlist !== 'undefined') {
                const list = SableWishlist.getWishlist();
                wishItem = list.find(item => SableWishlist.getItemKey(item) === key);
            }

            if (!wishItem && card) {
                const title = (card.querySelector('.wishlist-item-title') || {}).textContent || 'Product';
                const brand = (card.querySelector('.wishlist-item-brand') || {}).textContent || 'SABLE';
                const price = (card.querySelector('.wishlist-price-current') || {}).textContent || '₹999';
                const origPrice = (card.querySelector('.wishlist-price-original') || {}).textContent || '';
                const disc = (card.querySelector('.wishlist-discount-badge') || {}).textContent || '';
                const img = (card.querySelector('.wishlist-img') || {}).src || '';
                const link = (card.querySelector('a[href]') || {}).getAttribute ? card.querySelector('a[href]').getAttribute('href') : 'index.html';
                wishItem = {
                    title: title.trim(),
                    brand: brand.trim(),
                    price: price,
                    originalPrice: origPrice,
                    discount: disc,
                    image: img,
                    link: link,
                    size: 'M'
                };
            }

            // Add product into SableCart
            if (wishItem && typeof SableCart !== 'undefined') {
                SableCart.addToCart(wishItem, 1);
            }

            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                card.style.transition = 'all 0.3s ease';
            }

            setTimeout(() => {
                if (key && typeof SableWishlist !== 'undefined') {
                    SableWishlist.removeFromWishlist(key);
                }
                if (typeof SableCart !== 'undefined') {
                    SableCart.updateHeaderCartCount();
                }
                renderWishlistPage();

                if (typeof SableWishlist !== 'undefined' && typeof SableWishlist.showToast === 'function') {
                    SableWishlist.showToast(`Moved "${wishItem ? wishItem.title : 'Item'}" to Bag! 🛍️`);
                }
            }, card ? 300 : 0);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderWishlistPage();
            window.addEventListener('wishlistUpdated', renderWishlistPage);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Techvolt Software | Backend Development | Coimbatore</title>
    <meta name="description" content="Sign in to your customer account to access order tracking, saved wishlists, and express checkout.">
    <meta name="keywords" content="Techvolt Software, Backend Development, customer login, sign in, secure authentication">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.techvoltcoimbatore.com/login.html">
    <link rel="icon" type="image/png" href="assets/images/techvolt-software-development-brand-favicon.png">
    <link rel="apple-touch-icon" href="assets/images/techvolt-software-development-brand-favicon.png">
    <meta property="og:site_name" content="TechVoltMart">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.techvoltcoimbatore.com/login.html">
    <meta property="og:title" content="Techvolt Software | web Development | Customer Account Login">
    <meta property="og:description" content="Sign in to your customer account to access order tracking, saved wishlists, and express checkout.">
    <meta property="og:image" content="https://www.techvoltcoimbatore.com/assets/images/techvolt-software-development-brand-logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Techvolt Software | CRM | Customer Account Login">
    <meta name="twitter:description" content="Sign in to your customer account to access order tracking, saved wishlists, and express checkout.">
    <meta name="twitter:image" content="https://www.techvoltcoimbatore.com/assets/images/techvolt-software-development-brand-logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-page-wrapper {
            min-height: calc(100vh - 200px);
            background: linear-gradient(135deg, #fdfbf7 0%, #f4ece1 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #eae1d7;
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header .brand-subtitle {
            font-size: 13px;
            color: #8b6548;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }

        .auth-header h2 {
            font-size: 24px;
            font-weight: 800;
            color: #171717;
            margin: 0;
        }

        .form-group-custom {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label-custom {
            font-size: 12.5px;
            font-weight: 700;
            color: #333333;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i.input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999999;
            font-size: 16px;
        }

        .form-control-custom {
            width: 100%;
            height: 46px;
            padding-left: 42px;
            padding-right: 42px;
            border: 1px solid #dcd3ca;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            background: #fafafa;
            color: #171717;
            transition: all 0.25s ease;
        }

        .form-control-custom:focus {
            border-color: #ff3f6c;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 63, 108, 0.12);
        }

        .password-toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #777777;
            cursor: pointer;
            font-size: 16px;
            padding: 0;
        }

        .btn-auth-primary {
            width: 100%;
            height: 48px;
            background: #ff3f6c;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(255, 63, 108, 0.3);
            margin-top: 10px;
        }

        .btn-auth-primary:hover {
            background: #e0355c;
            box-shadow: 0 6px 20px rgba(255, 63, 108, 0.45);
            transform: translateY(-1px);
        }

        .auth-footer-text {
            text-align: center;
            margin-top: 24px;
            font-size: 13.5px;
            color: #666666;
        }

        .auth-footer-text a {
            color: #ff3f6c;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="top-header-bar">
            <div class="header-container">
                <a href="index.html" class="brand-logo" style="text-decoration: none;"><img src="assets/images/techvolt-software-development-brand-logo.png" alt="TechVoltMart Logo" class="brand-logo-img"><span class="brand-logo-text" style="display: inline-flex; flex-direction: column; justify-content: center; line-height: 1.1;"><span class="brand-name" style="font-size: 22px; font-weight: 800; letter-spacing: 0.4px;"><span class="brand-text-tech" style="color: #282c3f;">TechVolt</span><span class="brand-text-mart" style="color: #ff3f6c; margin-left: 1px;">Mart</span></span><span class="brand-sample-tag" style="font-size: 9px; font-weight: 700; color: #8c8d94; letter-spacing: 2px; text-transform: uppercase; font-family: 'DM Sans', sans-serif; margin-top: 1px;">SAMPLE WEBSITE</span></span></a>
                <div class="header-search">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" placeholder="Search for products, brands and more" class="search-input">
                </div>
                <div class="header-actions">
                    <a href="#" class="header-action-btn" id="btnHeaderNotification" title="Notifications"><i class="bi bi-bell"></i><span>Offers</span></a>
                    <a href="login.html" class="header-action-btn" style="color: #ff3f6c;"><i class="bi bi-box-arrow-in-right" style="color: #ff3f6c;"></i><span style="color: #ff3f6c; font-weight: 700;">Login</span></a>
                    <a href="wishlist.html" class="header-action-btn"><i class="bi bi-heart"></i><span>Wishlist</span></a>
                    <a href="cart.html" class="header-action-btn cart-btn"><i class="bi bi-bag"></i><span>Bag</span><span class="cart-count" style="display: none;">0</span></a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Login Section -->
    <div class="auth-page-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <span class="brand-subtitle">Welcome Back</span>
                <h2>Login to TechVoltMart</h2>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group-custom">
                    <label class="form-label-custom">Email or Mobile Number</label>
                    <div class="input-wrap">
                        <i class="bi bi-envelope input-icon"></i>
                        <input type="text" class="form-control-custom" placeholder="name@example.com or 10-digit mobile" id="loginId" required>
                    </div>
                </div>

                <div class="form-group-custom">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label-custom mb-0">Password</label>
                        <a href="#" class="small text-decoration-none" style="color: #ff3f6c; font-size: 12px; font-weight: 600;">Forgot?</a>
                    </div>
                    <div class="input-wrap">
                        <i class="bi bi-lock input-icon"></i>
                        <input type="password" class="form-control-custom" placeholder="Enter your password" id="loginPassword" required>
                        <button type="button" class="password-toggle-btn" onclick="togglePassword('loginPassword', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label small text-muted" for="rememberMe">
                        Keep me logged in on this device
                    </label>
                </div>

                <button type="submit" class="btn-auth-primary">Log In</button>
            </form>

            <div class="auth-footer-text">
                New to TechVoltMart? <a href="register.html" style="color: #ff3f6c; font-weight: 700; text-decoration: underline; margin-left: 4px;">Create an Account</a>
            </div>
        </div>
    </div>

    <!-- Alert Modal -->
    <div class="modal fade" id="authSuccessModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 48px;"></i>
                <h5 class="fw-bold mt-3 mb-1">Login Successful!</h5>
                <p class="small text-muted mb-3">Redirecting to home page...</p>
                <button type="button" class="btn btn-sm btn-primary w-100" onclick="window.location.href='index.html'">Continue</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const modal = new bootstrap.Modal(document.getElementById('authSuccessModal'));
            modal.show();
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        }
    </script>
    <script src="js/main.js"></script>
</body>
</html>
